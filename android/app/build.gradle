plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.dlip.chordpad'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.dlip.chordpad'
        minSdk 34
        targetSdk 35
        versionCode = (project.findProperty('chordpadVersionCode') ?: '1').toInteger()
        versionName = project.findProperty('chordpadVersionName') ?: '0.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    sourceSets {
        test.java.srcDir 'src/sharedTest/java'
        androidTest.java.srcDir 'src/sharedTest/java'
        androidTest.assets.srcDir 'src/test/resources'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions.unitTests.all {
        systemProperty 'chordpad.assets', file('src/main/assets').absolutePath
    }
    lint { abortOnError true }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
