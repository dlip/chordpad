[package]
name = "padtype"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Corpus-based gamepad chord layout generator"

[dependencies]
clap = { version = "4", features = ["derive"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
